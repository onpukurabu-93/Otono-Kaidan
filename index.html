<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ドレミをおぼえよう！</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px 10px;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        .top-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 {
            color: #ff6f61;
            font-size: 24px;
            margin: 0 0 10px 0;
        }
        .mode-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        button.mode-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 3px #388e3c;
            font-weight: bold;
        }
        button.mode-btn:active {
            box-shadow: 0 0 #388e3c;
            transform: translateY(3px);
        }
        #quiz-area {
            display: none;
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 90%;
            max-width: 340px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        #msg {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            min-height: 26px;
        }
        
        /* 🎹 横並びピアノ鍵盤のコンテナ */
        .piano-container {
            position: relative;
            width: 100%;
            max-width: 360px;
            height: 200px;
            margin: 0 auto 30px auto;
            background: #222;
            border-radius: 8px;
            padding: 4px 2px 15px 2px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        
        /* 白鍵 */
        .white-keys {
            display: flex;
            height: 100%;
            width: 100%;
        }
        .key.white {
            flex: 1;
            background: linear-gradient(to bottom, #fff 0%, #f3f3f3 100%);
            border-right: 1px solid #ccc;
            border-radius: 0 0 4px 4px;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 15px;
            font-weight: bold;
            font-size: 15px;
            color: #444;
            cursor: pointer;
            z-index: 1;
            box-shadow: inset 0 -4px 0 #edd;
        }
        .key.white:last-child {
            border-right: none;
        }
        .key.white:active, .key.white.active {
            background: #e0e0e0;
            box-shadow: inset 0 -1px 0 #ccc;
        }

        /* 黒鍵の配置用オーバーレイ */
        .black-keys-overlay {
            position: absolute;
            top: 4px;
            left: 2px;
            right: 2px;
            height: 60%;
            pointer-events: none;
            display: flex;
        }
        .black-gap {
            flex: 1;
            position: relative;
        }
        .key.black {
            position: absolute;
            right: -10px;
            width: 20px;
            height: 100%;
            background: linear-gradient(to bottom, #444 0%, #111 100%);
            border-radius: 0 0 3px 3px;
            z-index: 2;
            box-shadow: 0 2px 3px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div class="top-content">
        <h1>🎵 ドレミをおぼえよう！</h1>
        
        <div class="mode-container">
            <button class="mode-btn" onclick="startFreePlay()">えんそうモード</button>
            <button class="mode-btn" onclick="startQuiz()" style="background-color: #2196f3; box-shadow: 0 3px #1976d2;">おとあてクイズ</button>
        </div>

        <div id="quiz-area">
            <div id="msg">「おとをきく」をおしてね</div>
            <button class="mode-btn" style="background-color:#ff9800; box-shadow:0 3px #e65100; padding: 6px 16px; font-size:14px;" onclick="playTargetSound()">📢 おとをきく</button>
        </div>
    </div>

    <!-- 🎹 下半分のピアノ鍵盤 -->
    <div class="piano-container">
        <div class="white-keys">
            <div class="key white" onclick="pressKey('ド')">ド</div>
            <div class="key white" onclick="pressKey('レ')">レ</div>
            <div class="key white" onclick="pressKey('ミ')">ミ</div>
            <div class="key white" onclick="pressKey('ファ')">ファ</div>
            <div class="key white" onclick="pressKey('ソ')">ソ</div>
            <div class="key white" onclick="pressKey('ラ')">ラ</div>
            <div class="key white" onclick="pressKey('シ')">シ</div>
            <div class="key white" onclick="pressKey('ド↑')">ド</div>
        </div>

        <div class="black-keys-overlay">
            <div class="black-gap"><div class="key black"></div></div>
            <div class="black-gap"><div class="key black"></div></div>
            <div class="black-gap"></div>
            <div class="black-gap"><div class="key black"></div></div>
            <div class="black-gap"><div class="key black"></div></div>
            <div class="black-gap"><div class="key black"></div></div>
            <div class="black-gap"></div>
        </div>
    </div>

    <script>
        // 用意してもらった音声ファイルのマッピング
        const voiceFiles = {
            'ド': 'おへそのど.mp3',
            'レ': 'れ.mp3',
            'ミ': 'み.mp3',
            'ファ': 'ふぁ.mp3',
            'ソ': 'そ.mp3',
            'ラ': 'ら.mp3',
            'シ': 'し.mp3',
            'ド↑': '高いど.mp3'
        };

        // 各音の周波数データ（クイズ用のピアノ音に使用）
        const pianoFreqs = {
            'ド': 261.63, 'レ': 293.66, 'ミ': 329.63, 'ファ': 349.23,
            'ソ': 392.00, 'ラ': 440.00, 'シ': 493.88, 'ド↑': 523.25
        };

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        // 🎵 クイズ用の「綺麗なピアノの音」をプログラムで合成して鳴らす関数
        function playPianoTone(frequency) {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            // ピアノに近い減衰音を作るため、複数の倍音をほんのり混ぜる
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(frequency, ctx.currentTime);
            
            // 音量の変化（アタックは強く、その後スッと消えるピアノの特性）
            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.02); // 素早い立ち上がり
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2); // 長めの余韻
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start();
            osc.stop(ctx.currentTime + 1.2);
        }

        // 🗣️ 鍵盤を押したときの「声の音声」を再生する関数
        function playVoice(noteName) {
            const filename = voiceFiles[noteName];
            if (filename) {
                const audio = new Audio(filename);
                audio.currentTime = 0;
                audio.play().catch(e => console.log("音声再生エラー:", e));
            }
        }

        let isQuizMode = false;
        let currentTarget = null;
        const quizNotes = ['ド', 'レ', 'ミ', 'ファ', 'ソ', 'ラ', 'シ', 'ド↑'];

        // 鍵盤が押されたとき
        function pressKey(noteName) {
            // 演奏時・解答時は必ず「声の音声」を鳴らす
            playVoice(noteName);

            if (isQuizMode) {
                if (!currentTarget) {
                    document.getElementById('msg').innerText = 'さきに「おとをきく」をおしてね！';
                    return;
                }
                
                if (noteName === currentTarget) {
                    document.getElementById('msg').innerHTML = '<span style="color:green;">⭕ せいかい！ すごい！</span>';
                    currentTarget = null; 
                } else {
                    document.getElementById('msg').innerHTML = '<span style="color:red;">❌ ちがうよ！もう一回きいてみてね</span>';
                }
            }
        }

        function startFreePlay() {
            isQuizMode = false;
            document.getElementById('quiz-area').style.display = 'none';
        }

        function startQuiz() {
            isQuizMode = true;
            currentTarget = null;
            document.getElementById('quiz-area').style.display = 'block';
            document.getElementById('msg').innerText = '「おとをきく」ボタンをおしてね';
        }

        // クイズの音をきくとき
        function playTargetSound() {
            if (!isQuizMode) return;
            if (!currentTarget) {
                const randomIndex = Math.floor(Math.random() * quizNotes.length);
                currentTarget = quizNotes[randomIndex];
            }
            
            // クイズの問題を出すときは、声ではなく「ピアノの音」を鳴らす
            const freq = pianoFreqs[currentTarget];
            playPianoTone(freq);
            document.getElementById('msg').innerText = 'いまの音はなーんだ？';
        }
    </script>
</body>
</html>
