<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ドレミをおぼえよう！</title>
    <style>
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f7f9fc;
            margin: 0;
            padding: 10px;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        .top-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 { color: #ff6f61; font-size: 22px; margin: 0 0 5px 0; }
        .mode-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
        button.mode-btn {
            background-color: #4caf50; color: white; border: none; padding: 8px 16px;
            font-size: 14px; border-radius: 20px; cursor: pointer; box-shadow: 0 3px #388e3c; font-weight: bold;
        }
        button.mode-btn:active { box-shadow: 0 0 #388e3c; transform: translateY(3px); }
        #quiz-area {
            display: none; background: white; padding: 12px; border-radius: 10px;
            width: 90%; max-width: 340px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 10px;
        }
        #msg { font-size: 16px; font-weight: bold; margin: 5px 0; min-height: 24px; }
        
        /* 🎹 ピアノコンテナ（画像のサイズに自動で合わせる） */
        .piano-wrapper {
            position: relative;
            width: 100%;
            max-width: 360px;
            margin: 0 auto 10px auto;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            border-radius: 8px;
            overflow: hidden;
        }
        .piano-image { width: 100%; display: block; pointer-events: none; }
        .touch-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        
        /* 🔴 位置調整用の透明（または半透明赤）な鍵盤ボタン */
        .key-trigger {
            position: absolute;
            cursor: pointer;
            /* 👇 調整中はここを rgba(255, 0, 0, 0.4) にすると赤い四角が見えます。完成したら transparent にします */
            background: rgba(255, 0, 0, 0.4); 
            border: 1px solid rgba(255,255,255,0.5);
            transition: background 0.1s;
        }
        .key-trigger:active { background: rgba(0, 0, 0, 0.3) !important; }

        /* 🛠️ 位置調整用のコントローラーUI */
        .adjust-panel {
            background: #eee; padding: 8px; font-size: 12px; border-radius: 5px;
            margin: 5px auto; width: 100%; max-width: 360px; text-align: left;
        }
        .adjust-panel select, .adjust-panel input { width: 100%; margin: 3px 0 8px 0; }
    </style>
</head>
<body>

    <div class="top-content">
        <h1>🎵 ドレミをおぼえよう！</h1>
        <div class="mode-container">
            <button class="mode-btn" onclick="startFreePlay()">えんそうモード</button>
            <button class="mode-btn" onclick="startQuiz()" style="background-color: #2196f3; box-shadow: 0 3px #1976d2;">おとあてクイズ</button>
        </div>
        <div id="quiz-area">
            <div id="msg">「おとをきく」をおしてね</div>
            <button class="mode-btn" style="background-color:#ff9800; box-shadow:0 3px #e65100; padding: 6px 16px; font-size:14px;" onclick="playTargetSound()">📢 おとをきく</button>
        </div>
    </div>

    <!-- 🎹 ピアノ鍵盤領域 -->
    <div class="piano-wrapper">
        <img src="otonokaidan.png" alt="ピアノ鍵盤" class="piano-image">
        <div class="touch-overlay" id="overlay">
            <!-- JavaScriptでここにボタンを生成します -->
        </div>
    </div>

    <!-- 🛠️ 【調整用つまみ】位置がぴったり合ったらこの部品ごとコードから削除してOKです -->
    <div class="adjust-panel">
        <strong>🔧 ボタンの位置調整（完成したらこのパネルは消せます）</strong><br>
        <label>調整する音: <select id="select-note" onchange="loadKeyConfig()"></select></label>
        <label>横の位置 (左端からの%): <input type="range" id="input-left" min="0" max="100" step="0.5" oninput="updateKeyConfig()"></label>
        <label>縦の位置 (上端からの%): <input type="range" id="input-top" min="0" max="100" step="0.5" oninput="updateKeyConfig()"></label>
        <label>ボタンの横幅 (%): <input type="range" id="input-width" min="1" max="100" step="0.5" oninput="updateKeyConfig()"></label>
        <label>ボタンの縦幅 (%): <input type="range" id="input-height" min="1" max="100" step="0.5" oninput="updateKeyConfig()"></label>
        <button onclick="exportConfig()" style="width:100%; padding:5px; background:#444; color:#fff; border:none; border-radius:3px;">現在の設定数値をコピーする</button>
    </div>

    <script>
        // ▽▽▽ 【ここを後から書き換えます】 ▽▽▽
        // 初期状態：均等に並んでいます（画像に合わせてここが自動で変化します）
        let keyLayouts = {
            'ド':   { left: 0,    top: 50, width: 12.5, height: 50 },
            'レ':   { left: 12.5, top: 50, width: 12.5, height: 50 },
            'ミ':   { left: 25,   top: 50, width: 12.5, height: 50 },
            'ファ': { left: 37.5, top: 50, width: 12.5, height: 50 },
            'ソ':   { left: 50,   top: 50, width: 12.5, height: 50 },
            'ラ':   { left: 62.5, top: 50, width: 12.5, height: 50 },
            'シ':   { left: 75,   top: 50, width: 12.5, height: 50 },
            'ド↑': { left: 87.5, top: 50, width: 12.5, height: 50 }
        };
        // △△△ 【ここを後から書き換えます】 △△△

        const voiceFiles = {
            'ド': 'おへそのド.mp3', 'レ': 'れ.mp3', 'ミ': 'み.mp3', 'ファ': 'ふぁ.mp3',
            'ソ': 'そ.mp3', 'ラ': 'ら.mp3', 'シ': 'し.mp3', 'ド↑': '高いど.mp3'
        };
        const pianoFreqs = {
            'ド': 261.63, 'レ': 293.66, 'ミ': 329.63, 'ファ': 349.23,
            'ソ': 392.00, 'ラ': 440.00, 'シ': 493.88, 'ド↑': 523.25
        };

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playPianoTone(frequency) {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(frequency, ctx.currentTime);
            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 1.2);
        }

        function playVoice(noteName) {
            const filename = voiceFiles[noteName];
            if (filename) {
                const audio = new Audio(filename);
                audio.currentTime = 0; audio.play().catch(e => console.log(e));
            }
        }

        // ボタンの画面配置を生成する
        function renderKeys() {
            const overlay = document.getElementById('overlay');
            overlay.innerHTML = '';
            for (let note in keyLayouts) {
                const box = keyLayouts[note];
                const btn = document.createElement('div');
                btn.className = 'key-trigger';
                btn.style.left = box.left + '%';
                btn.style.top = box.top + '%';
                btn.style.width = box.width + '%';
                btn.style.height = box.height + '%';
                btn.onclick = () => pressKey(note);
                overlay.appendChild(btn);
            }
        }

        // 調整パネルの制御
        function initAdjustPanel() {
            const select = document.getElementById('select-note');
            for (let note in keyLayouts) {
                const opt = document.createElement('option');
                opt.value = note; opt.innerText = note;
                select.appendChild(opt);
            }
            loadKeyConfig();
        }

        function loadKeyConfig() {
            const note = document.getElementById('select-note').value;
            const config = keyLayouts[note];
            document.getElementById('input-left').value = config.left;
            document.getElementById('input-top').value = config.top;
            document.getElementById('input-width').value = config.width;
            document.getElementById('input-height').value = config.height;
        }

        function updateKeyConfig() {
            const note = document.getElementById('select-note').value;
            keyLayouts[note] = {
                left: parseFloat(document.getElementById('input-left').value),
                top: parseFloat(document.getElementById('input-top').value),
                width: parseFloat(document.getElementById('input-width').value),
                height: parseFloat(document.getElementById('input-height').value)
            };
            renderKeys();
        }

        function exportConfig() {
            const str = JSON.stringify(keyLayouts, null, 4);
            navigator.clipboard.writeText(str);
            alert("位置データをコピーしました！このデータを送っていただければ固定化します。");
        }

        // ゲームロジック
        let isQuizMode = false; let currentTarget = null;
        const quizNotes = ['ド', 'レ', 'ミ', 'ファ', 'ソ', 'ラ', 'シ', 'ド↑'];

        function pressKey(noteName) {
            playVoice(noteName);
            if (isQuizMode) {
                if (!currentTarget) { document.getElementById('msg').innerText = 'さきに「おとをきく」をおしてね！'; return; }
                if (noteName === currentTarget) {
                    document.getElementById('msg').innerHTML = '<span style="color:green;">⭕ せいかい！ すごい！</span>';
                    currentTarget = null; 
                } else {
                    document.getElementById('msg').innerHTML = '<span style="color:red;">❌ ちがうよ！もう一回きいてみてね</span>';
                }
            }
        }

        function startFreePlay() { isQuizMode = false; document.getElementById('quiz-area').style.display = 'none'; }
