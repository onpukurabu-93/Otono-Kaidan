<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ドレミをおぼえよう！</title>
    <style>
        /* 画面全体のズレ防止とスマホ最適化 */
        * { 
            box-sizing: border-box; 
            -webkit-user-select: none; 
            user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px 10px;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            overflow: hidden; /* スマホのバウンススクロールを防止 */
        }
        .top-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 { color: #ff6f61; font-size: 24px; margin: 0 0 10px 0; }
        .mode-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        button.mode-btn {
            background-color: #4caf50; color: white; border: none; padding: 10px 20px;
            font-size: 15px; border-radius: 20px; cursor: pointer; box-shadow: 0 3px #388e3c; font-weight: bold;
        }
        button.mode-btn:active { box-shadow: 0 0 #388e3c; transform: translateY(3px); }
        #quiz-area {
            display: none; background: white; padding: 15px; border-radius: 10px;
            width: 90%; max-width: 340px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px;
        }
        #msg { font-size: 18px; font-weight: bold; margin: 10px 0; min-height: 26px; }
        
        /* 🎹 ピアノコンテナ（画像のサイズに自動でフィット） */
        .piano-wrapper {
            position: relative;
            width: 100%;
            max-width: 360px; 
            margin: 0 auto 30px auto;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            border-radius: 8px;
            overflow: hidden;
        }
        .piano-image { width: 100%; display: block; pointer-events: none; }
        
        /* 画像の真上に重なる透明なタッチパネル */
        .touch-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; z-index: 10; }
        
        /* 透明な鍵盤エリア（8等分・タップのズレや遅延を解消） */
        .key-trigger {
            flex: 1;
            height: 100%;
            cursor: pointer;
            background: transparent;
            transition: background 0.1s;
            touch-action: manipulation; /* スマホのダブルタップズームによる連打遅延を防止 */
        }
        .key-trigger:active { background: rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>

    <div class="top-content">
        <h1>🎵 ドレミをおぼえよう！</h1>
        
        <div class="mode-container">
            <button class="mode-btn" onclick="startFreePlay()">えんそうモード</button>
            <button class="mode-btn" onclick="startQuiz()" style="background-color: #2196f3; box-shadow: 0 3px #1976d2;">おとあてクイズ</button>
        </div>

        <div id="quiz-area">
            <div id="msg">「おとをきく」をおしてね</div>
            <button class="mode-btn" style="background-color:#ff9800; box-shadow:0 3px #e65100; padding: 6px 16px; font-size:14px;" onclick="playTargetSound()">📢 おとをきく</button>
        </div>
    </div>

    <!-- 🎹 下半分のエリア -->
    <div class="piano-wrapper">
        <img src="otonokaidan.png" alt="ピアノ鍵盤" class="piano-image">
        <div class="touch-overlay">
            <div class="key-trigger" onclick="pressKey('ド')"></div>
            <div class="key-trigger" onclick="pressKey('レ')"></div>
            <div class="key-trigger" onclick="pressKey('ミ')"></div>
            <div class="key-trigger" onclick="pressKey('ファ')"></div>
            <div class="key-trigger" onclick="pressKey('ソ')"></div>
            <div class="key-trigger" onclick="pressKey('ラ')"></div>
            <div class="key-trigger" onclick="pressKey('シ')"></div>
            <div class="key-trigger" onclick="pressKey('ド↑')"></div>
        </div>
    </div>

    <script>
        // 音声ファイルの設定（「ラ」の表記ミスを完全修正）
        const voiceFiles = {
            'ド': 'おへそのド.mp3', 'レ': 'れ.mp3', 'ミ': 'み.mp3', 'ファ': 'ふぁ.mp3',
            'ソ': 'そ.mp3', 'ラ': 'ら.mp3', 'シ': 'し.mp3', 'ド↑': '高いど.mp3'
        };

        const pianoFreqs = {
            'ド': 261.63, 'レ': 293.66, 'ミ': 329.63, 'ファ': 349.23,
            'ソ': 392.00, 'ラ': 440.00, 'シ': 493.88, 'ド↑': 523.25
        };

        // 事前にAudioオブジェクトを生成（スマホでの再生遅延・音がブツ切れになる現象を回避）
        const audioCache = {};
        for (let note in voiceFiles) {
            audioCache[note] = new Audio(voiceFiles[note]);
            audioCache[note].load();
        }

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playPianoTone(frequency) {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(frequency, ctx.currentTime);
            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 1.2);
        }

        // 連打しても音が遅れずに重なって鳴るように改善
        function playVoice(noteName) {
            const audio = audioCache[noteName];
            if (audio) {
                // すでに再生中の場合は最初に戻して即再生（連打対応）
                audio.currentTime = 0;
                audio.play().catch(e => console.log("再生制限クリア中:", e));
            }
        }

        let isQuizMode = false; let currentTarget = null;
        const quizNotes = ['ド', 'レ', 'ミ', 'ファ', 'ソ', 'ラ', 'シ', 'ド↑'];

        function pressKey(noteName) {
            getAudioContext(); // タップと同時にオーディオのブロックを解除
            playVoice(noteName);

            if (isQuizMode) {
                if (!currentTarget) { document.getElementById('msg').innerText = 'さきに「おとをきく」をおしてね！'; return; }
                if (noteName === currentTarget) {
                    document.getElementById('msg').innerHTML = '<span style="color:green;">⭕ せいかい！ すごい！</span>';
                    currentTarget = null; 
                } else {
                    document.getElementById('msg').innerHTML = '<span style="color:red;">❌ ちがうよ！もう一回きいてみてね</span>';
                }
            }
        }

        function startFreePlay() { isQuizMode = false; document.getElementById('quiz-area').style.display = 'none'; }
        function startQuiz() { isQuizMode = true; currentTarget = null; document.getElementById('quiz-area').style.display = 'block'; document.getElementById('msg').innerText = '「おとをきく」ボタンをおしてね'; }
        
        function playTargetSound() {
            if (!isQuizMode) return;
            if (!currentTarget) currentTarget = quizNotes[Math.floor(Math.random() * quizNotes.length)];
            playPianoTone(pianoFreqs[currentTarget]);
            document.getElementById('msg').innerText = 'いまの音はなーんだ？';
        }

        // スマホのブラウザ保護ロック（初回の画面タッチで音が出る状態にする）
        document.addEventListener('click', () => getAudioContext(), { once: true });
        document.addEventListener('touchstart', () => getAudioContext(), { once: true });
    </script>
</body>
</html>
