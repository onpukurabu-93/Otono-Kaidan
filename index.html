<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ドレミをおぼえよう！</title>
    <style>
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f7f9fc;
            margin: 0;
            padding: 10px;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        .top-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #ff6f61; font-size: 20px; margin: 0 0 5px 0; }
        .mode-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 5px; }
        button.mode-btn {
            background-color: #4caf50; color: white; border: none; padding: 6px 12px;
            font-size: 13px; border-radius: 20px; cursor: pointer; box-shadow: 0 3px #388e3c; font-weight: bold;
        }
        button.mode-btn:active { box-shadow: 0 0 #388e3c; transform: translateY(3px); }
        #quiz-area {
            display: none; background: white; padding: 8px; border-radius: 8px;
            width: 90%; max-width: 320px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 5px;
        }
        #msg { font-size: 15px; font-weight: bold; margin: 3px 0; min-height: 20px; }
        
        /* 🎹 縦長の階段画像を配置するコンテナ */
        .piano-wrapper {
            position: relative;
            width: 100%;
            max-width: 280px; /* 縦長にするため幅を少しスリムに */
            flex: 1;
            margin: 0 auto 5px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            background: #000;
        }
        .piano-image { height: 100%; width: auto; display: block; pointer-events: none; }
        .touch-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        
        /* 🔴 縦に並ぶボタン（一番上がド↑、一番下がド） */
        .key-trigger {
            position: absolute;
            left: 10%;
            width: 80%;
            cursor: pointer;
            background: rgba(255, 0, 0, 0.4); /* 調整用：後で transparent にします */
            border: 1px solid rgba(255,255,255,0.6);
            transition: background 0.1s;
        }
        .key-trigger:active { background: rgba(0, 0, 0, 0.3) !important; }

        .adjust-panel {
            background: #eee; padding: 6px; font-size: 11px; border-radius: 5px;
            margin: 0 auto; width: 100%; max-width: 320px; text-align: left;
        }
        .adjust-panel select, .adjust-panel input { width: 100%; margin: 2px 0 4px 0; }
    </style>
</head>
<body>

    <div class="top-content">
        <h1>🎵 ドレミをおぼえよう！</h1>
        <div class="mode-container">
            <button class="mode-btn" onclick="startFreePlay()">えんそう</button>
            <button class="mode-btn" onclick="startQuiz()" style="background-color: #2196f3; box-shadow: 0 3px #1976d2;">クイズ</button>
        </div>
        <div id="quiz-area">
            <div id="msg">「おとをきく」をおしてね</div>
            <button class="mode-btn" style="background-color:#ff9800; box-shadow:0 3px #e65100; padding: 4px 10px; font-size:12px;" onclick="playTargetSound()">📢 おとをきく</button>
        </div>
    </div>

    <!-- 🎹 縦長エリア -->
    <div class="piano-wrapper">
        <img src="otonokaidan.png" alt="音の階段" class="piano-image" id="kaiidan-img">
        <div class="touch-overlay" id="overlay"></div>
    </div>

    <div class="adjust-panel">
        <strong>🔧 縦の階段位置調整</strong><br>
        <label>調整する音: <select id="select-note" onchange="loadKeyConfig()"></select></label>
        <label>縦の位置 (上端からの%): <input type="range" id="input-top" min="0" max="100" step="0.5" oninput="updateKeyConfig()"></label>
        <label>高さ (%): <input type="range" id="input-height" min="1" max="50" step="0.5" oninput="updateKeyConfig()"></label>
        <button onclick="exportConfig()" style="width:100%; padding:3px; background:#444; color:#fff; border:none; border-radius:3px;">設定をコピーする</button>
    </div>

    <script>
        // 初期配置：上（0%）から下（100%）へ ド↑〜ド を縦に8分割
        let keyLayouts = {
            'ド↑': { top: 0,   height: 12.5 },
            'シ':   { top: 12.5, height: 12.5 },
            'ラ':   { top: 25,   height: 12.5 },
            'ソ':   { top: 37.5, height: 12.5 },
            'ファ': { top: 50,   height: 12.5 },
            'ミ':   { top: 62.5, height: 12.5 },
            'レ':   { top: 75,   height: 12.5 },
            'ド':   { top: 87.5, height: 12.5 }
        };

        const voiceFiles = {
            'ド': 'おへそのド.mp3', 'レ': 'れ.mp3', 'ミ': 'み.mp3', 'ファ': 'ふぁ.mp3',
            'ソ': 'そ.mp3', 'ら': 'ら.mp3', 'シ': 'し.mp3', 'ド↑': '高いど.mp3'
        };
        const pianoFreqs = {
            'ド': 261.63, 'レ': 293.66, 'ミ': 329.63, 'ファ': 349.23,
            'ソ': 392.00, 'ラ': 440.00, 'シ': 493.88, 'ド↑': 523.25
        };

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playPianoTone(freq) {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 1.2);
        }

        function playVoice(noteName) {
            const filename = voiceFiles[noteName];
            if (filename) {
                const audio = new Audio(filename);
                audio.currentTime = 0; audio.play().catch(e => {});
            }
        }

        function renderKeys() {
            const overlay = document.getElementById('overlay');
            overlay.innerHTML = '';
            for (let note in keyLayouts) {
                const box = keyLayouts[note];
                const btn = document.createElement('div');
                btn.className = 'key-trigger';
                btn.style.top = box.top + '%';
                btn.style.height = box.height + '%';
                btn.onclick = () => pressKey(note);
                overlay.appendChild(btn);
            }
        }

        function initAdjustPanel() {
            const select = document.getElementById('select-note');
            for (let note in keyLayouts) {
                const opt = document.createElement('option');
                opt.value = note; opt.innerText = note;
                select.appendChild(opt);
            }
            loadKeyConfig();
        }

        function loadKeyConfig() {
            const note = document.getElementById('select-note').value;
            const config = keyLayouts[note];
            document.getElementById('input-top').value = config.top;
            document.getElementById('input-height').value = config.height;
        }

        function updateKeyConfig() {
            const note = document.getElementById('select-note').value;
            keyLayouts[note] = {
                top: parseFloat(document.getElementById('input-top').value),
                height: parseFloat(document.getElementById('input-height').value)
            };
            renderKeys();
        }

        function exportConfig() {
            navigator.clipboard.writeText(JSON.stringify(keyLayouts, null, 4));
            alert("縦位置データをコピーしました！");
        }

        let isQuizMode = false; let currentTarget = null;
        const quizNotes = ['ド', 'レ', 'ミ', 'ファ', 'ソ', 'ラ', 'シ', 'ド↑'];

        function pressKey(noteName) {
            playVoice(noteName);
            if (isQuizMode) {
                if (!currentTarget) { document.getElementById('msg').innerText = '「おとをきく」をおしてね'; return; }
                if (noteName === currentTarget) {
                    document.getElementById('msg').innerHTML = '<span style="color:green;">⭕ せいかい！</span>';
                    currentTarget = null; 
                } else {
                    document.getElementById('msg').innerHTML = '<span style="color:red;">❌ ちがうよ</span>';
                }
            }
        }

        function startFreePlay() { isQuizMode = false; document.getElementById('quiz-area').style.display = 'none'; }
        function startQuiz() { isQuizMode = true; currentTarget = null; document.getElementById('quiz-area').style.display = 'block'; document.getElementById('msg').innerText = '「おとをきく」をおしてね'; }
        
        function playTargetSound() {
            if (!isQuizMode) return;
            if (!currentTarget) currentTarget = quizNotes[Math.floor(Math.random() * quizNotes.length)];
            playPianoTone(pianoFreqs[currentTarget]);
            document.getElementById('msg').innerText = 'なーんだ？';
        }

        window.onload = () => { renderKeys(); initAdjustPanel(); };
        document.addEventListener('click', () => getAudioContext(), { once: true });
    </script>
</body>
</html>
