<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ドレミをおぼえよう！</title>
    <style>
        * { 
            box-sizing: border-box; 
            -webkit-user-select: none; 
            user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f7f9fc;
            margin: 0;
            padding: 10px;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        
        header { padding: 5px 0; }
        h1 { color: #ff6f61; font-size: 22px; margin: 0; }
        
        .control-panel {
            margin: 5px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 90px;
            justify-content: center;
        }
        .mode-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 5px; }
        button.mode-btn {
            background-color: #4caf50; color: white; border: none; padding: 6px 14px;
            font-size: 13px; border-radius: 20px; cursor: pointer; box-shadow: 0 3px #388e3c; font-weight: bold;
        }
        button.mode-btn:active { box-shadow: 0 0 #388e3c; transform: translateY(3px); }
        
        #quiz-area {
            display: none; background: white; padding: 8px; border-radius: 8px;
            width: 95%; max-width: 340px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        #msg { font-size: 15px; font-weight: bold; margin: 3px 0; min-height: 20px; }

        /* 🎹 画像表示エリア */
        .piano-container-box {
            flex: 1;
            display: flex;
            align-items: center; 
            justify-content: center;
            width: 100%;
            margin-bottom: 15px;
        }
        
        .piano-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px; 
            background-color: #fff;
            border-radius: 8px;
        }
        
        .piano-image { 
            width: 100%; 
            height: auto; 
            display: block; 
            pointer-events: none; 
        }
        
        /* 透明なタッチパネル */
        .touch-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            z-index: 10; 
        }
        
        /* 透明な鍵盤エリア（8等分） */
        .key-trigger {
            flex: 1;
            height: 100%;
            cursor: pointer;
            background: transparent;
            transition: background 0.1s;
            touch-action: manipulation;
        }
        .key-trigger:active { background: rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>

    <!-- 1. タイトル -->
    <header>
        <h1>🎵 ドレミをおぼえよう！</h1>
    </header>
    
    <!-- 2. ボタン・クイズエリア -->
    <div class="control-panel">
        <div class="mode-container">
            <button class="mode-btn" onclick="startFreePlay()">えんそうモード</button>
            <button class="mode-btn" onclick="startQuiz()" style="background-color: #2196f3; box-shadow: 0 3px #1976d2;">おとあてクイズ</button>
        </div>

        <div id="quiz-area">
            <div id="msg">「おとをきく」をおしてね</div>
            <button class="mode-btn" style="background-color:#ff9800; box-shadow:0 3px #e65100; padding: 4px 12px; font-size:13px;" onclick="playTargetSound()">📢 おとをきく</button>
        </div>
    </div>

    <!-- 3. 🎹 画像をそのままの比率で最大化して映すエリア -->
    <div class="piano-container-box">
        <div class="piano-wrapper">
            <img src="otonokaidan.png" alt="ピアノ鍵盤" class="piano-image">
            <div class="touch-overlay">
                <div class="key-trigger" onclick="pressKey('低ド')"></div>
                <div class="key-trigger" onclick="pressKey('レ')"></div>
                <div class="key-trigger" onclick="pressKey('ミ')"></div>
                <div class="key-trigger" onclick="pressKey('ファ')"></div>
                <div class="key-trigger" onclick="pressKey('ソ')"></div>
                <div class="key-trigger" onclick="pressKey('ラ')"></div>
                <div class="key-trigger" onclick="pressKey('シ')"></div>
                <div class="key-trigger" onclick="pressKey('高ド')"></div>
            </div>
        </div>
    </div>

    <script>
        // 音声ファイルの設定（新しいファイル名に変更完了！）
        const voiceFiles = {
            '低ド': 'ohesonoど.mp3', 
            'レ': 'れ.mp3', 
            'ミ': 'み.mp3', 
            'ファ': 'ふぁ.mp3',
            'ソ': 'そ.mp3', 
            'ラ': 'ら.mp3', 
            'シ': 'し.mp3', 
            '高ド': 'takaiど.mp3'
        };

        // クイズ用のピアノ音の周波数
        const pianoFreqs = {
            '低ド': 261.63, 'レ': 293.66, 'ミ': 329.63, 'ファ': 349.23,
            'ソ': 392.00, 'ラ': 440.00, 'シ': 493.88, '高ド': 523.25
        };

        // 音声オブジェクトを事前に読み込み
        const audioCache = {};
        for (let note in voiceFiles) {
            audioCache[note] = new Audio(voiceFiles[note]);
            audioCache[note].load();
        }

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        // クイズ用ピアノ音
        function playPianoTone(frequency) {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(frequency, ctx.currentTime);
            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 1.2);
        }

        function playVoice(noteName) {
            const audio = audioCache[noteName];
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log(e));
            }
        }

        let isQuizMode = false; let currentTarget = null;
        const quizNotes = ['低ド', 'レ', 'ミ', 'ファ', 'ソ', 'ラ', 'シ', '高ド'];

        function pressKey(noteName) {
            getAudioContext();
            playVoice(noteName);

            if (isQuizMode) {
                if (!currentTarget) { document.getElementById('msg').innerText = 'さきに「おとをきく」をおしてね！'; return; }
                
                if (noteName === currentTarget) {
                    document.getElementById('msg').innerHTML = '<span style="color:green;">⭕ せいかい！ すごい！</span>';
                    currentTarget = null; 
                } else {
                    document.getElementById('msg').innerHTML = '<span style="color:red;">❌ ちがうよ！もう一回きいてみてね</span>';
                }
            }
        }

        function startFreePlay() { isQuizMode = false; document.getElementById('quiz-area').style.display = 'none'; }
        function startQuiz() { isQuizMode = true; currentTarget = null; document.getElementById('quiz-area').style.display = 'block'; document.getElementById('msg').innerText = '「おとをきく」ボタンをおしてね'; }
        
        function playTargetSound() {
            if (!isQuizMode) return;
            if (!currentTarget) currentTarget = quizNotes[Math.floor(Math.random() * quizNotes.length)];
            playPianoTone(pianoFreqs[currentTarget]);
            document.getElementById('msg').innerText = 'いまの音はなーんだ？';
        }

        document.addEventListener('click', () => getAudioContext(), { once: true });
        document.addEventListener('touchstart', () => getAudioContext(), { once: true });
    </script>
</body>
</html>
