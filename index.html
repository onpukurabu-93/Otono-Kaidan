<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ドレミをおぼえよう！</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px 10px;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        .top-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 {
            color: #ff6f61;
            font-size: 24px;
            margin: 0 0 10px 0;
        }
        .mode-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        button.mode-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 3px #388e3c;
            font-weight: bold;
        }
        button.mode-btn:active {
            box-shadow: 0 0 #388e3c;
            transform: translateY(3px);
        }
        #quiz-area {
            display: none;
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 90%;
            max-width: 340px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        #msg {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            min-height: 26px;
        }
        
        /* 🎹 横並びピアノ鍵盤のコンテナ */
        .piano-container {
            position: relative;
            width: 100%;
            max-width: 360px; /* スマホの幅にフィット */
            height: 200px;
            margin: 0 auto 30px auto;
            background: #222;
            border-radius: 8px;
            padding: 4px 2px 15px 2px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        
        /* 白鍵（左から右へ並ぶ） */
        .white-keys {
            display: flex;
            height: 100%;
            width: 100%;
        }
        .key.white {
            flex: 1;
            background: linear-gradient(to bottom, #fff 0%, #f3f3f3 100%);
            border-right: 1px solid #ccc;
            border-radius: 0 0 4px 4px;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 15px;
            font-weight: bold;
            font-size: 15px;
            color: #444;
            cursor: pointer;
            z-index: 1;
            box-shadow: inset 0 -4px 0 #edd;
        }
        .key.white:last-child {
            border-right: none;
        }
        .key.white:active, .key.white.active {
            background: #e0e0e0;
            box-shadow: inset 0 -1px 0 #ccc;
        }

        /* 黒鍵の配置用オーバーレイ */
        .black-keys-overlay {
            position: absolute;
            top: 4px;
            left: 2px;
            right: 2px;
            height: 60%; /* 白鍵の長さの6割 */
            pointer-events: none; /* 白鍵のタップを邪魔しない */
            display: flex;
        }
        /* 白鍵1枚分と同じ幅のスペース */
        .black-gap {
            flex: 1;
            position: relative;
        }
        /* 黒鍵本体（白鍵の境目にまたがって配置） */
        .key.black {
            position: absolute;
            right: -10px; /* 境目の真上に乗せる調整 */
            width: 20px;  /* 黒鍵の幅 */
            height: 100%;
            background: linear-gradient(to bottom, #444 0%, #111 100%);
            border-radius: 0 0 3px 3px;
            z-index: 2;
            box-shadow: 0 2px 3px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <!-- 上半分のコンテンツ領域 -->
    <div class="top-content">
        <h1>🎵 ドレミをおぼえよう！</h1>
        
        <div class="mode-container">
            <button class="mode-btn" onclick="startFreePlay()">えんそうモード</button>
            <button class="mode-btn" onclick="startQuiz()" style="background-color: #2196f3; box-shadow: 0 3px #1976d2;">おとあてクイズ</button>
        </div>

        <div id="quiz-area">
            <div id="msg">「おとをきく」をおしてね</div>
            <button class="mode-btn" style="background-color:#ff9800; box-shadow:0 3px #e65100; padding: 6px 16px; font-size:14px;" onclick="playTargetSound()">📢 おとをきく</button>
        </div>
    </div>

    <!-- 🎹 下半分のピアノ鍵盤（スマホ縦持ち画面で横に並ぶ） -->
    <div class="piano-container">
        <!-- 白鍵（ドレミファソラシド） -->
        <div class="white-keys">
            <div class="key white" onclick="pressKey('ド', 261.63)">ド</div>
            <div class="key white" onclick="pressKey('レ', 293.66)">レ</div>
            <div class="key white" onclick="pressKey('ミ', 329.63)">ミ</div>
            <div class="key white" onclick="pressKey('ファ', 349.23)">ファ</div>
            <div class="key white" onclick="pressKey('ソ', 392.00)">ソ</div>
            <div class="key white" onclick="pressKey('ラ', 440.00)">ラ</div>
            <div class="key white" onclick="pressKey('シ', 493.88)">シ</div>
            <div class="key white" onclick="pressKey('ド↑', 523.25)">ド</div>
        </div>

        <!-- 黒鍵（見た目の位置理解のための表示専用。タップは無効） -->
        <div class="black-keys-overlay">
            <div class="black-gap"><div class="key black"></div></div> <!-- ドとレの間 -->
            <div class="black-gap"><div class="key black"></div></div> <!-- レとミの間 -->
            <div class="black-gap"></div> <!-- ミとファの間（黒鍵なし） -->
            <div class="black-gap"><div class="key black"></div></div> <!-- ファとソの間 -->
            <div class="black-gap"><div class="key black"></div></div> <!-- ソとラの間 -->
            <div class="black-gap"><div class="key black"></div></div> <!-- ラとシの間 -->
            <div class="black-gap"></div> <!-- シとド↑の間（黒鍵なし） -->
        </div>
    </div>

    <script>
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playTone(frequency) {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(frequency, ctx.currentTime);
            
            gain.gain.setValueAtTime(0.4, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
        }

        let isQuizMode = false;
        let currentTarget = null;
        
        const quizNotes = [
            { name: 'ド', freq: 261.63 },
            { name: 'レ', freq: 293.66 },
            { name: 'ミ', freq: 329.63 },
            { name: 'ファ', freq: 349.23 },
            { name: 'ソ', freq: 392.00 },
            { name: 'ラ', freq: 440.00 },
            { name: 'シ', freq: 493.88 },
            { name: 'ド↑', freq: 523.25 }
        ];

        function pressKey(noteName, frequency) {
            playTone(frequency);

            if (isQuizMode) {
                if (!currentTarget) {
                    document.getElementById('msg').innerText = 'さきに「おとをきく」をおしてね！';
                    return;
                }
                
                if (noteName === currentTarget.name) {
                    document.getElementById('msg').innerHTML = '<span style="color:green;">⭕ せいかい！ すごい！</span>';
                    currentTarget = null;
                } else {
                    document.getElementById('msg').innerHTML = '<span style="color:red;">❌ ちがうよ！もう一回きいてみてね</span>';
                }
            }
        }

        function startFreePlay() {
            isQuizMode = false;
            document.getElementById('quiz-area').style.display = 'none';
        }

        function startQuiz() {
            isQuizMode = true;
            currentTarget = null;
            document.getElementById('quiz-area').style.display = 'block';
            document.getElementById('msg').innerText = '「おとをきく」ボタンをおしてね';
        }

        function playTargetSound() {
            if (!isQuizMode) return;
            if (!currentTarget) {
                const randomIndex = Math.floor(Math.random() * quizNotes.length);
                currentTarget = quizNotes[randomIndex];
                document.getElementById('msg').innerText = 'いまの音はなーんだ？';
            }
            playTone(currentTarget.freq);
        }
    </script>
</body>
</html>
